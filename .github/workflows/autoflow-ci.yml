name: AutoFlow CI

# Redesigned 2026-10-07 (#1566). PR layer: 6 parallel jobs, target 10 min.
# Main push layer: +3 jobs (full e2e, cold install, consumer matrix).
# Full audit trail: PR #1567 review + issue #1566.
#
# Two-tier qualification (alpha15 consolidation, Q-CI):
#   Base CI — the four base jobs (lint, test, e2e, pack) run on every push
#              (main and alpha15-consolidation) and on PRs. On a plain
#              alpha15-consolidation push the five heavy jobs stay skipped
#              *by design*: that run is Base CI, not full qualification.
#   Full qualification — a main push still runs all nine (unchanged), and
#              workflow_dispatch with full_qualification=true runs all nine
#              on the dispatched ref's SHA, re-runnably. expected_sha is
#              REQUIRED for a full dispatch: the sha-guard job refuses an
#              unbound full qualification before any other job starts, and
#              refuses a candidate SHA that does not match the SHA the jobs
#              actually build, so a dispatch can never qualify a different
#              commit.
#
# Qualification contract: the run conclusion is not the evidence. The
# contract is the nine jobs' individual conclusions — lint, test, e2e, pack,
# e2e-full, bfcache, node-serve-smoke, packed-consumer-matrix, fresh-install
# all `success` on the candidate SHA. A green run with the five heavy jobs
# skipped is Base CI only; a skipped job is a *skipped conclusion* and must
# never be read as a success (GitHub's run-level green can hide it, so read
# the nine job conclusions, never the run conclusion alone).

on:
  push:
    # main keeps its existing layer; alpha15-consolidation is the Base CI
    # branch for the alpha15 line. No path filters: they would create
    # evidence gaps on exactly the changes that need the proof.
    branches: [main, alpha15-consolidation]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_qualification:
        description: 'Run all nine jobs (full qualification); requires expected_sha. false = four base jobs only'
        required: false
        type: boolean
        default: false
      expected_sha:
        description: 'Candidate SHA to bind this dispatch to (required when full_qualification=true; must equal the SHA the jobs build)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # One lane per (ref, qualification mode). The mode is the same predicate the
  # five heavy jobs use below, so a Base run and a Full run on one ref can
  # never cancel each other: a full_qualification dispatch on
  # alpha15-consolidation lands in ci-…-full while the running Base CI push
  # stays in ci-…-base (and the reverse), instead of the old single
  # ci-${{ github.ref }} lane destroying one another's evidence. Correct for
  # both events: push never reads a dispatch input (mode = full on main, base
  # elsewhere, matching the heavy-job gate), dispatch uses full_qualification.
  # Same-mode runs on a ref (push→push, or dispatch→dispatch of one mode) keep
  # today's cancel-in-progress semantics — the newer run supersedes the older
  # one in its own lane only.
  group: >-
    ci-${{ github.ref }}-${{
      ((github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && inputs.full_qualification == true))
      && 'full' || 'base'
    }}
  cancel-in-progress: true

jobs:
  # ── Job 0: Exact-SHA guard (runs before every other job, every event) ──
  # Deliberately has no `if:` — it must be scheduled on every event so it can
  # never be skipped by a condition. All nine real jobs `needs` it and use a
  # plain `if:` (no always()/status function), so a failed or skipped guard
  # skips them all: no job can report success unless the guard concluded
  # success. This job is the single enforcement point for the two fail-closed
  # SHA rules — the nine jobs carry no copy of them:
  #   1. full_qualification=true requires expected_sha: an unbound full
  #      dispatch is refused before any job starts, so "full qualification"
  #      can never mean "whatever the ref happens to point at".
  #   2. expected_sha must equal the SHA the jobs will actually build, which
  #      is `github.event.pull_request.head.sha || github.sha` — exactly the
  #      base jobs' checkout ref. On a pull_request, github.sha names the
  #      synthetic merge commit while the jobs build the PR head SHA, so
  #      comparing against github.sha alone would reject a PR run for the
  #      wrong reason; on push and workflow_dispatch there is no
  #      pull_request payload, the expression reduces to github.sha, and the
  #      guard binds the dispatch to exactly the commit the nine jobs check
  #      out (a mismatch is refused, never accepted for the wrong commit).
  sha-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Bind the run to the expected candidate SHA (fail closed)
        env:
          FULL_QUALIFICATION: ${{ inputs.full_qualification }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUN_SHA: ${{ github.sha }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${FULL_QUALIFICATION}" = "true" ] && [ -z "${EXPECTED_SHA}" ]; then
            echo "::error::full_qualification=true requires expected_sha; refusing an unbound full qualification (fail closed)."
            exit 1
          fi
          if [ -z "${EXPECTED_SHA}" ]; then
            echo "No expected_sha supplied (push/PR or unbound base dispatch); build SHA is ${BUILD_SHA} (github.sha ${RUN_SHA})."
            exit 0
          fi
          if [ "${EXPECTED_SHA}" != "${BUILD_SHA}" ]; then
            echo "::error::Refusing to run: expected_sha=${EXPECTED_SHA} != build SHA ${BUILD_SHA} (the SHA the jobs check out)"
            exit 1
          fi
          echo "Bound to candidate SHA ${BUILD_SHA}."

  # ── Job 1: Lint, Security & Governance ────────────────────────────────
  lint:
    needs: [sha-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Workflow lint (actionlint)
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      - name: Security audit (zizmor, pinned)
        run: |
          pip install --user zizmor==1.30.0
          export PATH="$HOME/.local/bin:$PATH"
          # Exit 11 = informational findings (safe fixes only); fail only on medium+
          zizmor --offline .github || [ $? -eq 11 ]
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose .
      - uses: ./.github/actions/setup-node-workspace
      - name: Fast checks (fmt, lint, typecheck, markdown)
        run: vp run check
      - name: Generate all artifacts
        run: vp run generate:all
      - name: Interface snapshot check
        run: vp run --fail-if-no-match @openelement/tools-repo#interface:snapshot
      - name: Governance checks (boundaries, provenance, state machine)
        run: |
          vp run --fail-if-no-match @openelement/tools-repo#esm:boundary-check
          vp run --fail-if-no-match @openelement/tools-repo#signals:check-protocol-boundary
          vp run --fail-if-no-match @openelement/tools-repo#validation:boundary-check
          vp run --fail-if-no-match @openelement/tools-repo#assets:check-provenance
          vp run --fail-if-no-match @openelement/tools-repo#release:state-machine:check
          vp run --fail-if-no-match @openelement/tools-repo#workspace:links:check
          vp run --fail-if-no-match @openelement/tools-repo#deps:vite-check
      - name: Dependency review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  # ── Job 2: Unit Tests + Browser Gate (3 engines) ──────────────────────
  test:
    needs: [sha-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install all browser engines
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Element tests
        run: vp run --fail-if-no-match @openelement/element#test
      - name: Router tests (includes 3-engine browser tests)
        run: vp run --fail-if-no-match @openelement/router#test
      - name: UI, create and tools tests
        # The review gap: the PR layer ran only element+router, so ui/create/
        # tools reds (style shells, stale schedule assertions) were invisible
        # until the release train. All six product surfaces now gate the PR.
        # The tools suites ride the root vitest "tools" project (the repo
        # package has no aggregate test task by design).
        run: |
          vp run --fail-if-no-match @openelement/ui#test
          vp run --fail-if-no-match @openelement/create#test
          # The tools suites read www's generated data modules (release-line,
          # content) — a fresh checkout carries none until this runs.
          vp run --fail-if-no-match @openelement/www#generate:content
          ./node_modules/.bin/vitest run --project tools
      - name: Compiler tests (independent suite)
        # The PR layer ran element+router+ui+create+www+tools but never the
        # compiler's own suite, so a lowering/candidate regression was invisible
        # until the release train. It is the package the whole compiled-authoring
        # contract rests on; it gates the PR now.
        run: vp run --fail-if-no-match @openelement/compiler#test
      - name: Element browser gate (chromium)
        # Deliberately the single-engine gate: this is the fast layer. Its name
        # says which engines it ran — the three-engine matrix is
        # `browser:gate:full`, wired into the e2e-full job below, and this step
        # used to be called "full matrix" while running chromium alone.
        run: vp run --fail-if-no-match @openelement/element#browser:gate

  # ── Job 3: Site E2E (chromium-only in PR; full on main) ───────────────
  e2e:
    needs: [sha-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - name: Install chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build site
        run: vp run site:build
      - name: WWW unit tests (build-output invariants)
        # The www vitest project asserts on the built site (www/dist), so it
        # needs the Build site step above. After the #1567 redesign no CI lane
        # ran it — only the release train's coverage step did — yet it carries
        # the guards registered in seams.md (#1544 shared element-runtime
        # chunk, #1552 eager-script budget, #1555 pagefind filter).
        run: vp run --fail-if-no-match @openelement/www#test
      - name: Site E2E (chromium only — full 3-engine on main push)
        run: vp run --fail-if-no-match @openelement/www#e2e:chromium
      - name: Light-probe E2E (build fixture first)
        run: |
          vp run --fail-if-no-match @openelement/fixture-site-light-probe#build
          vp run --fail-if-no-match @openelement/fixture-site-light-probe#e2e
      - name: Web component interop
        run: vp run --fail-if-no-match @openelement/fixture-web-component-interop#test

  # ── Job 4: Pack & Consumer Verification ────────────────────────────────
  # 40 minutes (measured): the starter smoke alone runs pack, scaffold,
  # install, SSG build and the bfcache probe; shared runners need 2-3x the
  # local wall clock (runs timed out at exactly 15, then at 25).
  pack:
    needs: [sha-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install browsers for packed consumers
        # --with-deps: WebKit needs host libraries (libgtk-4, gstreamer, …)
        # the plain browser download does not bring — the packed starter smoke
        # drives all three engines (the old workflow's install-deps step).
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Pack dry-run
        run: vp run --fail-if-no-match @openelement/tools-release#pack:dry-run
      - name: Pack surface check
        run: vp run --fail-if-no-match @openelement/tools-release#pack-surface:check
      - name: Publish dry-run (no-op against real registry)
        run: vp run --fail-if-no-match @openelement/tools-release#publish:npm:dry-run
      - name: Starter smoke (needs packed workspace)
        run: vp run --fail-if-no-match @openelement/e2e-starter-smoke#gate

  # ── Heavy qualification layer (5 jobs) ────────────────────────────────
  # Runs on a main push (unchanged) and on a workflow_dispatch with
  # full_qualification=true (the re-runnable Full qualification path on the
  # dispatched SHA). A plain push to alpha15-consolidation skips all five by
  # design: that push is Base CI. Every job needs sha-guard, so none of them
  # can run — let alone report success — without the guard's success.
  e2e-full:
    needs: [sha-guard]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full_qualification == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - name: Install all browser engines
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Build site
        run: vp run --fail-if-no-match site:build
      - name: Site E2E (3 engines)
        run: vp run --fail-if-no-match @openelement/www#e2e:browsers
      - name: Element browser gate (full matrix, chromium+firefox+webkit)
        # The qualified candidate needs the browser conformance suite and its
        # per-engine negative proofs on all three engines. `browser:gate:full`
        # sets OE_BROWSER_MATRIX=full for both halves; the base layer keeps the
        # chromium-only `browser:gate`.
        run: vp run --fail-if-no-match @openelement/element#browser:gate:full
      - name: Fixture gates
        run: |
          vp run --fail-if-no-match @openelement/fixture-router-native-framework#gate
          vp run --fail-if-no-match @openelement/fixture-router-lit-framework#gate
          vp run --fail-if-no-match @openelement/fixture-router-ui-dogfood#gate
          vp run --fail-if-no-match @openelement/fixture-router-static-only#build
      - name: Nitro proofs
        run: |
          vp run --fail-if-no-match @openelement/fixture-router-nitro#proof:node
          vp run --fail-if-no-match @openelement/fixture-router-nitro#proof:workers

  bfcache:
    needs: [sha-guard]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full_qualification == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - name: Install Chrome channel and xvfb
        run: |
          ./node_modules/.bin/playwright install chrome
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Build the packed starter
        run: vp run --fail-if-no-match @openelement/e2e-starter-smoke#setup
      - name: BFCache restore (Chrome channel, headed)
        run: xvfb-run -a vp run --fail-if-no-match @openelement/e2e-starter-smoke#test:bfcache

  node-serve-smoke:
    needs: [sha-guard]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full_qualification == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Pack the release tarballs
        run: vp run --fail-if-no-match @openelement/tools-release#pack:dry-run
      - name: Packed serve proof under Node ${{ matrix.node }}
        run: node tools/release/consumer-packaged-node-serve.ts node

  packed-consumer-matrix:
    needs: [sha-guard]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full_qualification == true)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install browsers
        run: ./node_modules/.bin/playwright install chromium firefox webkit
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo ./node_modules/.bin/playwright install-deps chromium firefox webkit
      - name: Pack the release tarballs
        run: vp run --fail-if-no-match @openelement/tools-release#pack:dry-run
      - name: Fresh packed-starter consumer proof
        run: vp run --fail-if-no-match @openelement/tools-release#consumer:packaged

  fresh-install:
    needs: [sha-guard]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full_qualification == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      # The cold-install proof deliberately skips the workspace setup action
      # (whose node_modules cache would defeat it), so pnpm is installed here
      # the same way: exact pin over https against registry.npmjs.org.
      - name: Install pnpm
        run: npm install -g pnpm@12.8.1 # zizmor: ignore[adhoc-packages] — same pin and rationale as the setup action
      - name: Fresh install (empty store)
        # --cache-dir is gone from pnpm 12's install (the error blames
        # --frozen-lockfile but the parser dies on cache-dir); the empty
        # --store-dir alone carries the cold-install proof — the store holds
        # every tarball pnpm would otherwise cache.
        run: |
          mkdir -p /tmp/fresh-store
          pnpm install --frozen-lockfile \
            --store-dir /tmp/fresh-store
      - name: Cold typecheck
        run: |
          npx tsc --noEmit -p packages/element/tsconfig.json
          npx tsc --noEmit -p packages/router/tsconfig.json
